<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <title>离线 — OfflineTasks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .offline-container {
      max-width: 400px;
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #94a3b8;
    }
    p {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-retry:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
    .hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📴</div>
    <h1>你当前处于离线状态</h1>
    <p>OfflineTasks 的数据已保存在本地，联网后将自动同步。<br>检查网络连接后点击重试。</p>
    <button class="btn-retry" onclick="window.location.reload()">🔄 重试连接</button>
    <p class="hint">💡 提示：你仍可在主应用中查看已缓存的任务</p>
  </div>
  <script>
    // 自动检测网络恢复
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
