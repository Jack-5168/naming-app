<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="OfflineTasks — 完全离线可用的任务管理 PWA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OfflineTasks">
  <title>OfflineTasks — 离线任务管理器</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%233b82f6' width='100' height='100' rx='16'/><path d='M30 50l15 15 25-30' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">📋 OfflineTasks</h1>
      <div id="connection-indicator" class="connection-indicator">
        <span class="status-dot"></span>
        <span class="status-text">检测中...</span>
      </div>
    </div>
    <div class="header-right">
      <button id="install-btn" class="btn btn-install" style="display:none" title="安装 PWA">📲 安装</button>
      <button id="notify-btn" class="btn btn-icon-only" title="开启通知">🔔</button>
      <button id="export-btn" class="btn btn-icon-only" title="导出数据">💾</button>
      <button id="import-btn" class="btn btn-icon-only" title="导入数据">📂</button>
      <button id="category-btn" class="btn btn-icon-only" title="管理分类">🏷️</button>
      <button id="sync-btn" class="btn btn-sync" title="同步">🔄 同步</button>
    </div>
  </header>

  <!-- 统计卡片 -->
  <section class="stats-section">
    <div id="task-stats" class="stats-grid">
      <div class="stat-card"><span class="stat-number">0</span><span class="stat-label">加载中...</span></div>
    </div>
  </section>

  <!-- 筛选栏 -->
  <section class="filter-section">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="搜索任务标题、描述、标签...">
    </div>
    <div class="filter-group">
      <select id="status-filter" class="filter-select">
        <option value="all">全部状态</option>
        <option value="todo">待办</option>
        <option value="in-progress">进行中</option>
        <option value="done">已完成</option>
        <option value="archived">已归档</option>
      </select>
      <select id="priority-filter" class="filter-select">
        <option value="all">全部优先级</option>
        <option value="urgent">🔴 紧急</option>
        <option value="high">🟠 高</option>
        <option value="medium">🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
      <select id="category-filter" class="filter-select">
        <option value="all">全部分类</option>
      </select>
    </div>
  </section>

  <!-- 任务列表 -->
  <main class="main-content">
    <div id="task-list" class="task-list">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <h3>加载中...</h3>
      </div>
    </div>
  </main>

  <!-- 悬浮添加按钮 -->
  <button id="add-task-btn" class="fab" title="新建任务 (Ctrl+N)">+</button>

  <!-- 任务编辑模态框 -->
  <div id="task-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">➕ 新建任务</h2>
        <button class="modal-close" onclick="closeTaskModal()">✕</button>
      </div>
      <form id="task-form" class="task-form">
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label for="task-title-input">标题 *</label>
          <input type="text" id="task-title-input" required placeholder="输入任务标题..." maxlength="100">
        </div>
        <div class="form-group">
          <label for="task-desc-input">描述</label>
          <textarea id="task-desc-input" rows="3" placeholder="输入任务描述..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority-input">优先级</label>
            <select id="task-priority-input">
              <option value="low">🟢 低</option>
              <option value="medium" selected>🟡 中</option>
              <option value="high">🟠 高</option>
              <option value="urgent">🔴 紧急</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-status-input">状态</label>
            <select id="task-status-input">
              <option value="todo">待办</option>
              <option value="in-progress">进行中</option>
              <option value="done">已完成</option>
              <option value="archived">已归档</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-category-input">分类</label>
            <select id="task-category-input">
              <option value="">无分类</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-due-input">截止日期</label>
            <input type="date" id="task-due-input">
          </div>
        </div>
        <div class="form-group">
          <label for="task-tags-input">标签</label>
          <input type="text" id="task-tags-input" placeholder="用逗号分隔，如：前端, 紧急, 设计">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">取消</button>
          <button type="submit" class="btn btn-primary">💾 保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 分类管理模态框 -->
  <div id="category-modal" class="modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>🏷️ 分类管理</h2>
        <button class="modal-close" onclick="closeCategoryModal()">✕</button>
      </div>
      <form id="category-form" class="category-form" onsubmit="addCategory(event)">
        <div class="form-group">
          <input type="text" id="cat-name-input" placeholder="输入分类名称..." required maxlength="20">
          <button type="submit" class="btn btn-primary btn-sm">添加</button>
        </div>
      </form>
      <div id="category-list" class="category-list">
        <p class="empty-text">加载中...</p>
      </div>
    </div>
  </div>

  <!-- 通知容器 -->
  <div id="notification-container" class="notification-container"></div>

  <!-- 脚本 -->
  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
