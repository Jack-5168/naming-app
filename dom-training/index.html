<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM 操作专项训练 — 原生 DOM API 深度练习</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 20px;
      }
      h1 {
        text-align: center;
        margin-bottom: 24px;
        color: #38bdf8;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 16px;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
      }
      .card h2 {
        color: #38bdf8;
        font-size: 16px;
        margin-bottom: 12px;
      }
      .card h2 span {
        color: #64748b;
        font-size: 12px;
      }
      .card pre {
        background: #0f172a;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        font-size: 12px;
        color: #94a3b8;
      }
      .card .demo {
        margin-top: 12px;
        padding: 12px;
        background: #0f172a;
        border-radius: 8px;
        min-height: 40px;
      }
      .card .demo button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        margin: 4px;
      }
      .card .demo button:hover {
        background: #2563eb;
      }
      .card .demo .item {
        padding: 6px 10px;
        margin: 4px 0;
        background: #1e293b;
        border-radius: 6px;
        cursor: pointer;
      }
      .card .demo .highlight {
        background: #065f46 !important;
      }
      .card .demo .red {
        background: #7f1d1d !important;
      }
      .card .demo .green {
        background: #065f46 !important;
      }
      .card .demo .yellow {
        background: #713f12 !important;
      }
      .card .demo input {
        background: #0f172a;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 6px 10px;
        border-radius: 6px;
        width: 100%;
        margin-bottom: 8px;
      }
      .card .demo .log {
        font-size: 11px;
        color: #64748b;
        max-height: 80px;
        overflow-y: auto;
      }
      .card .demo .perf-bar {
        height: 20px;
        background: #1e293b;
        border-radius: 4px;
        overflow: hidden;
        margin: 4px 0;
      }
      .card .demo .perf-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.3s;
      }
      .card .demo .perf-fill.blue {
        background: #3b82f6;
      }
      .card .demo .perf-fill.green {
        background: #22c55e;
      }
      .card .demo .perf-fill.red {
        background: #ef4444;
      }
      .card .demo .node {
        display: inline-block;
        padding: 4px 8px;
        margin: 2px;
        background: #334155;
        border-radius: 4px;
        font-size: 11px;
      }
      .card .demo .node.added {
        background: #065f46;
      }
      .card .demo .node.removed {
        background: #7f1d1d;
        text-decoration: line-through;
      }
      .card .demo .node.unchanged {
        background: #334155;
      }
      .card .demo .node.updated {
        background: #713f12;
      }
      .card .demo .observer-box {
        width: 60px;
        height: 60px;
        background: #334155;
        border-radius: 8px;
        transition: all 0.3s;
      }
      .card .demo .observer-box.expanded {
        width: 120px;
        height: 80px;
        background: #3b82f6;
      }
      .card .demo .virtual-item {
        padding: 8px;
        margin: 2px 0;
        background: #1e293b;
        border-radius: 4px;
      }
      .card .demo .shadow-host {
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 12px;
      }
      .card .demo .mutation-box {
        padding: 10px;
        background: #1e293b;
        border-radius: 8px;
        min-height: 30px;
      }
      .card .demo .intersection-target {
        height: 100px;
        background: #334155;
        border-radius: 8px;
        margin: 20px 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card .demo .intersection-target.visible {
        background: #065f46;
      }
    </style>
  </head>
  <body>
    <h1>🎯 DOM 操作专项训练 — 15 个原生 API 深度示例</h1>
    <div class="grid" id="cards"></div>

    <script>
      // ============================================================
      // 示例 1: 事件委托 — 动态列表
      // ============================================================
      (function example1() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>① 事件委托 — 动态列表 <span>Event Delegation</span></h2>
    <pre>
// 核心思想：在父元素上监听，通过 event.target 判断来源
// 优势：新增子元素自动拥有事件处理能力
ul.addEventListener('click', (e) => {
  const item = e.target.closest('.list-item');
  if (!item) return;
  item.classList.toggle('highlight');
});</pre>
    <div class="demo" id="demo1">
      <button onclick="window.demo1_add()">添加项</button>
      <ul id="list1" style="list-style:none;padding:0;"></ul>
    </div>`;
        container.appendChild(card);

        let count = 0;
        const ul = document.getElementById("list1");
        ul.addEventListener("click", (e) => {
          const item = e.target.closest(".list-item");
          if (!item) return;
          item.classList.toggle("highlight");
        });
        window.demo1_add = () => {
          const li = document.createElement("li");
          li.className = "list-item";
          li.textContent = `项目 ${++count}（点击切换高亮）`;
          ul.appendChild(li);
        };
        for (let i = 0; i < 3; i++) window.demo1_add();
      })();

      // ============================================================
      // 示例 2: 事件委托 — 多级嵌套
      // ============================================================
      (function example2() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>② 事件委托 — 多级嵌套 <span>Nested Delegation</span></h2>
    <pre>
// 同一容器处理多种子元素的不同操作
tree.addEventListener('click', (e) => {
  if (e.target.matches('.delete-btn')) { ... }
  if (e.target.matches('.expand-btn')) { ... }
  if (e.target.matches('.node-text')) { ... }
});</pre>
    <div class="demo" id="demo2">
      <div id="tree2" style="padding-left:10px;"></div>
    </div>`;
        container.appendChild(card);

        const tree = document.getElementById("tree2");
        const data = [
          {
            name: "src",
            children: [
              {
                name: "components",
                children: [{ name: "Header.jsx" }, { name: "Footer.jsx" }],
              },
              { name: "utils", children: [{ name: "helpers.js" }] },
            ],
          },
          { name: "package.json" },
        ];

        function renderTree(items, depth = 0) {
          let html = "";
          items.forEach((item) => {
            const hasChildren = item.children;
            html += `<div style="padding-left:${depth * 16}px">
        <span class="node-text" style="cursor:pointer">${hasChildren ? "📁" : "📄"} ${item.name}</span>
        <button class="delete-btn" style="background:#ef4444;padding:2px 6px;border:none;color:white;border-radius:3px;cursor:pointer;margin-left:4px;font-size:10px">✕</button>
        ${hasChildren ? `<button class="expand-btn" style="background:#3b82f6;padding:2px 6px;border:none;color:white;border-radius:3px;cursor:pointer;margin-left:4px;font-size:10px">▼</button>` : ""}
      </div>`;
            if (hasChildren)
              html += `<div class="subtree">${renderTree(item.children, depth + 1)}</div>`;
          });
          return html;
        }
        tree.innerHTML = renderTree(data);

        tree.addEventListener("click", (e) => {
          const btn = e.target;
          if (btn.classList.contains("delete-btn")) {
            btn.closest("div[style]").remove();
          } else if (btn.classList.contains("expand-btn")) {
            const subtree = btn.closest("div[style]").nextElementSibling;
            if (subtree)
              subtree.style.display =
                subtree.style.display === "none" ? "" : "none";
            btn.textContent =
              subtree && subtree.style.display === "none" ? "▶" : "▼";
          } else if (btn.classList.contains("node-text")) {
            btn.classList.toggle("highlight");
          }
        });
      })();

      // ============================================================
      // 示例 3: DOM Diff 算法 — 最小化更新
      // ============================================================
      (function example3() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>③ DOM Diff — 最小化更新 <span>Diff Algorithm</span></h2>
    <pre>
// 对比新旧节点列表，只更新变化的部分
function diff(oldList, newList) {
  const oldSet = new Set(oldList);
  const newSet = new Set(newList);
  return {
    added: newList.filter(i => !oldSet.has(i)),
    removed: oldList.filter(i => !newSet.has(i)),
    unchanged: oldList.filter(i => newSet.has(i))
  };
}</pre>
    <div class="demo" id="demo3">
      <button onclick="window.demo3_diff()">执行 Diff</button>
      <div id="diff-result3" style="margin-top:8px;"></div>
    </div>`;
        container.appendChild(card);

        let oldList = ["A", "B", "C", "D", "E"];
        let step = 0;
        const scenarios = [
          { old: ["A", "B", "C", "D", "E"], new: ["A", "C", "E", "F", "G"] },
          {
            old: ["A", "C", "E", "F", "G"],
            new: ["A", "B", "C", "D", "E", "F"],
          },
          { old: ["A", "B", "C", "D", "E", "F"], new: ["Z", "Y", "X"] },
        ];

        window.demo3_diff = () => {
          const { old, new: newList } = scenarios[step % scenarios.length];
          const oldSet = new Set(old);
          const newSet = new Set(newList);
          const added = newList.filter((i) => !oldSet.has(i));
          const removed = old.filter((i) => !newSet.has(i));
          const unchanged = old.filter((i) => newSet.has(i));

          const result = document.getElementById("diff-result3");
          result.innerHTML = `
      <div style="margin-bottom:8px;font-size:11px;color:#64748b">旧: [${old.join(", ")}] → 新: [${newList.join(", ")}]</div>
      <div>未变: ${unchanged.map((i) => `<span class="node unchanged">${i}</span>`).join("")}</div>
      <div>新增: ${added.map((i) => `<span class="node added">${i}</span>`).join("")}</div>
      <div>移除: ${removed.map((i) => `<span class="node removed">${i}</span>`).join("")}</div>`;
          step++;
        };
      })();

      // ============================================================
      // 示例 4: DOM Diff — 元素级对比
      // ============================================================
      (function example4() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>④ DOM Diff — 元素级对比 <span>Element Diff</span></h2>
    <pre>
// 对比两个 DOM 节点树，找出需要 patch 的部分
function patchNode(oldNode, newNode) {
  if (!oldNode) return createNode(newNode);
  if (!newNode) { oldNode.remove(); return; }
  if (oldNode.tagName !== newNode.tagName) {
    oldNode.replaceWith(createNode(newNode));
    return;
  }
  // 对比属性、子节点...
}</pre>
    <div class="demo" id="demo4">
      <button onclick="window.demo4_patch()">执行 Patch</button>
      <div id="patch-result4" style="margin-top:8px;font-size:12px;"></div>
    </div>`;
        container.appendChild(card);

        const vdom = [
          { tag: "div", props: { class: "box" }, children: ["Hello"] },
          {
            tag: "div",
            props: { class: "box active" },
            children: ["Hello World"],
          },
        ];

        window.demo4_patch = () => {
          const oldV = vdom[0],
            newV = vdom[1];
          const changes = [];
          if (oldV.tag !== newV.tag)
            changes.push(`标签变更: ${oldV.tag} → ${newV.tag}`);
          if (oldV.props.class !== newV.props.class)
            changes.push(
              `属性变更: class="${oldV.props.class}" → "${newV.props.class}"`,
            );
          if (oldV.children[0] !== newV.children[0])
            changes.push(
              `文本变更: "${oldV.children[0]}" → "${newV.children[0]}"`,
            );

          const result = document.getElementById("patch-result4");
          result.innerHTML = changes
            .map((c) => `<div style="padding:4px 0;color:#38bdf8">→ ${c}</div>`)
            .join("");
        };
      })();

      // ============================================================
      // 示例 5: 性能优化 — DocumentFragment
      // ============================================================
      (function example5() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>⑤ 性能优化 — DocumentFragment <span>Batch Insert</span></h2>
    <pre>
// 使用 DocumentFragment 批量插入，只触发一次 reflow
const frag = document.createDocumentFragment();
for (let i = 0; i < 1000; i++) {
  const div = document.createElement('div');
  div.textContent = i;
  frag.appendChild(div);
}
container.appendChild(frag); // 仅 1 次 reflow</pre>
    <div class="demo" id="demo5">
      <button onclick="window.demo5_fragment()">Fragment 插入 1000 项</button>
      <button onclick="window.demo5_direct()">直接插入 1000 项</button>
      <div id="perf-result5" style="margin-top:8px;font-size:12px;"></div>
      <div id="list5" style="display:none;"></div>
    </div>`;
        container.appendChild(card);

        const list5 = document.getElementById("list5");

        window.demo5_fragment = () => {
          list5.innerHTML = "";
          const start = performance.now();
          const frag = document.createDocumentFragment();
          for (let i = 0; i < 1000; i++) {
            const div = document.createElement("div");
            div.className = "virtual-item";
            div.textContent = `Item ${i}`;
            frag.appendChild(div);
          }
          list5.appendChild(frag);
          const elapsed = (performance.now() - start).toFixed(2);
          document.getElementById("perf-result5").innerHTML =
            `<span style="color:#22c55e">✅ DocumentFragment: ${elapsed}ms</span>`;
        };

        window.demo5_direct = () => {
          list5.innerHTML = "";
          const start = performance.now();
          for (let i = 0; i < 1000; i++) {
            const div = document.createElement("div");
            div.className = "virtual-item";
            div.textContent = `Item ${i}`;
            list5.appendChild(div);
          }
          const elapsed = (performance.now() - start).toFixed(2);
          document.getElementById("perf-result5").innerHTML =
            `<span style="color:#ef4444">⚠️ 直接插入: ${elapsed}ms</span>`;
        };
      })();

      // ============================================================
      // 示例 6: 性能优化 — requestAnimationFrame
      // ============================================================
      (function example6() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>⑥ 性能优化 — requestAnimationFrame <span>rAF Scheduling</span></h2>
    <pre>
// 将 DOM 操作对齐到浏览器帧，避免布局抖动
function animate() {
  element.style.transform = \`translateX(\${x}px)\`;
  x += 2;
  if (x < 300) requestAnimationFrame(animate);
}
requestAnimationFrame(animate);</pre>
    <div class="demo" id="demo6">
      <button onclick="window.demo6_raf()">启动 rAF 动画</button>
      <div id="anim-track6" style="position:relative;height:30px;margin-top:8px;">
        <div id="anim-box6" style="width:30px;height:30px;background:#3b82f6;border-radius:6px;position:absolute;top:0;left:0;"></div>
      </div>
      <div id="raf-counter6" style="font-size:11px;color:#64748b;margin-top:4px;"></div>
    </div>`;
        container.appendChild(card);

        window.demo6_raf = () => {
          let x = 0;
          let frames = 0;
          const box = document.getElementById("anim-box6");
          const counter = document.getElementById("raf-counter6");
          function step() {
            box.style.transform = `translateX(${x}px)`;
            x += 3;
            frames++;
            counter.textContent = `帧数: ${frames} | 位置: ${x}px`;
            if (x < 300) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        };
      })();

      // ============================================================
      // 示例 7: 性能优化 — 防抖 & 节流
      // ============================================================
      (function example7() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>⑦ 性能优化 — 防抖 & 节流 <span>Debounce & Throttle</span></h2>
    <pre>
// 防抖：等待用户停止操作后才执行
function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

// 节流：固定间隔内只执行一次
function throttle(fn, ms) {
  let last = 0;
  return (...args) => {
    const now = Date.now();
    if (now - last >= ms) { last = now; fn(...args); }
  };
}</pre>
    <div class="demo" id="demo7">
      <input id="debounce-input7" placeholder="输入测试防抖（500ms）">
      <input id="throttle-input7" placeholder="输入测试节流（500ms）">
      <div class="log" id="log7"></div>
    </div>`;
        container.appendChild(card);

        const log7 = document.getElementById("log7");
        function log(msg) {
          const div = document.createElement("div");
          div.textContent = msg;
          log7.prepend(div);
          if (log7.children.length > 20) log7.removeChild(log7.lastChild);
        }

        function debounce(fn, ms) {
          let timer;
          return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => fn(...args), ms);
          };
        }
        function throttle(fn, ms) {
          let last = 0;
          return (...args) => {
            const now = Date.now();
            if (now - last >= ms) {
              last = now;
              fn(...args);
            }
          };
        }

        document.getElementById("debounce-input7").addEventListener(
          "input",
          debounce((e) => log(`🔵 防抖触发: "${e.target.value}"`), 500),
        );
        document.getElementById("throttle-input7").addEventListener(
          "input",
          throttle((e) => log(`🟢 节流触发: "${e.target.value}"`), 500),
        );
      })();

      // ============================================================
      // 示例 8: IntersectionObserver — 懒加载 & 可见性检测
      // ============================================================
      (function example8() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>⑧ IntersectionObserver — 可见性检测 <span>Lazy Load</span></h2>
    <pre>
// 监听元素进入视口
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      entry.target.textContent = '✅ 可见！';
    }
  });
}, { threshold: 0.5 });

observer.observe(targetElement);</pre>
    <div class="demo" id="demo8" style="max-height:200px;overflow-y:auto;">
      <div style="height:60px;display:flex;align-items:center;justify-content:center;color:#64748b;">↓ 滚动查看下方元素 ↓</div>
      <div class="intersection-target" id="target8a">目标 A</div>
      <div class="intersection-target" id="target8b">目标 B</div>
      <div class="intersection-target" id="target8c">目标 C</div>
    </div>`;
        container.appendChild(card);

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                entry.target.textContent = "✅ 可见！";
              } else {
                entry.target.classList.remove("visible");
                entry.target.textContent = entry.target.id.replace(
                  "target",
                  "目标 ",
                );
              }
            });
          },
          { root: document.getElementById("demo8"), threshold: 0.5 },
        );

        ["target8a", "target8b", "target8c"].forEach((id) =>
          observer.observe(document.getElementById(id)),
        );
      })();

      // ============================================================
      // 示例 9: MutationObserver — DOM 变更监听
      // ============================================================
      (function example9() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>⑨ MutationObserver — DOM 变更监听 <span>Mutation Tracking</span></h2>
    <pre>
// 监听 DOM 树的变更（子节点、属性、字符数据）
const observer = new MutationObserver((mutations) => {
  mutations.forEach(m => {
    console.log('类型:', m.type);
    console.log('新增节点:', m.addedNodes);
    console.log('移除节点:', m.removedNodes);
  });
});

observer.observe(target, {
  childList: true,
  attributes: true,
  subtree: true
});</pre>
    <div class="demo" id="demo9">
      <button onclick="window.demo9_add()">添加子节点</button>
      <button onclick="window.demo9_attr()">修改属性</button>
      <button onclick="window.demo9_remove()">移除节点</button>
      <div class="mutation-box" id="mutation-target9"></div>
      <div class="log" id="mutation-log9" style="margin-top:8px;"></div>
    </div>`;
        container.appendChild(card);

        const target9 = document.getElementById("mutation-target9");
        const log9 = document.getElementById("mutation-log9");
        let childCount = 0;

        const observer9 = new MutationObserver((mutations) => {
          mutations.forEach((m) => {
            const div = document.createElement("div");
            div.textContent = `[${m.type}] ${m.addedNodes.length > 0 ? `+${m.addedNodes.length}节点` : ""} ${m.removedNodes.length > 0 ? `-${m.removedNodes.length}节点` : ""} ${m.attributeName ? `属性:${m.attributeName}` : ""}`;
            log9.prepend(div);
            if (log9.children.length > 15) log9.removeChild(log9.lastChild);
          });
        });
        observer9.observe(target9, {
          childList: true,
          attributes: true,
          subtree: true,
          attributeOldValue: true,
          characterDataOldValue: true,

      (function example12() {

    <pre>
// 只渲染视口内的 DOM 节点
function renderVisible() {
  const scrollTop = container.scrollTop;
  const visibleCount = Math.ceil(containerHeight / itemHeight);
  const startIndex = Math.floor(scrollTop / itemHeight);
  // 只创建 startIndex ~ startIndex + visibleCount 个节点
}</pre>
    <div class="demo" id="demo12">
      <div id="virtual-scroll12" style="height:150px;overflow-y:auto;border:1px solid #334155;border-radius:8px;position:relative;">
        <div id="virtual-content12" style="position:relative;"></div>
      </div>

        const contentEl = document.getElementById("virtual-content12");
        const infoEl = document.getElementById("virtual-info12");

        const TOTAL = 10000;
        const VIEWPORT_HEIGHT = 150;

        contentEl.style.height = `${TOTAL * ITEM_HEIGHT}px`;

        function render() {
          const scrollTop = scrollEl.scrollTop;
          const startIdx = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - 2);
          const endIdx = Math.min(
            TOTAL,
            Math.ceil((scrollTop + VIEWPORT_HEIGHT) / ITEM_HEIGHT) + 2,
          );
          const visibleCount = endIdx - startIdx;

          let html = "";
          for (let i = startIdx; i < endIdx; i++) {
            html += `<div style="position:absolute;top:${i * ITEM_HEIGHT}px;height:${ITEM_HEIGHT}px;left:0;right:0;display:flex;align-items:center;padding:0 12px;font-size:12px;" class="virtual-item">行 ${i} — 数据内容</div>`;

      // 示例 14: 性能对比 — innerHTML vs createElement vs Fragment
      // ============================================================
      (function example14() {
        const container = document.getElementById("cards");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <h2>⑭ 性能对比 — 三种渲染方式 <span>Performance Benchmark</span></h2>
    <pre>
// 对比 innerHTML / createElement / DocumentFragment
// 10000 条数据的渲染耗时

// 方法 1: innerHTML（最快，但 XSS 风险）
// 方法 2: createElement（最安全，但较慢）
// 方法 3: Fragment（安全且较快）</pre>
    <div class="demo" id="demo14">
      <button onclick="window.demo14_bench()">运行基准测试</button>
      <div id="bench-result14" style="margin-top:8px;font-size:12px;"></div>
    </div>`;
        container.appendChild(card);

        window.demo14_bench = () => {
          const N = 5000;
          const results = {};

          // innerHTML
          let start = performance.now();
          let html = "";
          for (let i = 0; i < N; i++)
            html += `<div class="virtual-item">Item ${i}</div>`;
          const frag1 = document.createElement("div");
          frag1.innerHTML = html;
          results.innerHTML = performance.now() - start;

          // createElement
          start = performance.now();
          const frag2 = document.createElement("div");
          for (let i = 0; i < N; i++) {
            const div = document.createElement("div");
            div.className = "virtual-item";
            div.textContent = `Item ${i}`;
            frag2.appendChild(div);
          }
          results.createElement = performance.now() - start;

          // DocumentFragment
          start = performance.now();
          const frag3 = document.createDocumentFragment();
          for (let i = 0; i < N; i++) {
            const div = document.createElement("div");
            div.className = "virtual-item";
            div.textContent = `Item ${i}`;
            frag3.appendChild(div);
          }
          results.fragment = performance.now() - start;

          const max = Math.max(
            results.innerHTML,
            results.createElement,
            results.fragment,
          );
          const resultEl = document.getElementById("bench-result14");
          resultEl.innerHTML = `
      <div style="margin-bottom:4px;">innerHTML: <span style="color:#3b82f6">${results.innerHTML.toFixed(2)}ms</span>
        <div class="perf-bar"><div class="perf-fill blue" style="width:${((results.innerHTML / max) * 100).toFixed(0)}%"></div></div></div>
      <div style="margin-bottom:4px;">createElement: <span style="color:#22c55e">${results.createElement.toFixed(2)}ms</span>
        <div class="perf-bar"><div class="perf-fill green" style="width:${((results.createElement / max) * 100).toFixed(0)}%"></div></div></div>
      <div>Fragment: <span style="color:#ef4444">${results.fragment.toFixed(2)}ms</span>
        <div class="perf-bar"><div class="perf-fill red" style="width:${((results.fragment / max) * 100).toFixed(0)}%"></div></div></div>`;
        };
      })();

    <pre>
// 用函数式 API 构建 DOM 树
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat().forEach(child => {
    if (typeof child === 'string') child = document.createTextNode(child);

  });

}</pre>

    </div>`;
        container.appendChild(card);

        function h(tag, props = {}, ...children) {
          const el = document.createElement(tag);
          Object.entries(props).forEach(([k, v]) => {
            if (k.startsWith("on"))
              el.addEventListener(k.slice(2).toLowerCase(), v);
            else if (k === "className") el.className = v;
            else if (k === "style" && typeof v === "object")
              Object.assign(el.style, v);
            else el.setAttribute(k, v);
          });
          children.flat().forEach((child) => {
            if (typeof child === "string")
              child = document.createTextNode(child);
            el.appendChild(child);
          });
          return el;
        }

        const output = document.getElementById("builder-output15");
        let counter = 0;

        const app = h(
          "div",
          {},
          h(
            "h3",
            { style: { color: "#38bdf8", margin: "0 0 8px 0" } },
            "🧩 DOM 构建器示例",

          ),
        );

        const countEl = app.querySelector("#count-display");
        output.appendChild(app);
